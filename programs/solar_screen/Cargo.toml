[package]
name = "solar_screen"
version = "0.1.0"
description = "Solar DePIN — SOL escrow for AI call-screening jobs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solar_screen"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "2.2"
